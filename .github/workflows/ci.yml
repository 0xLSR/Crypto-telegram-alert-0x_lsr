name: Bot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax
        run: python -m py_compile bot.py wallet.py market_flow.py market_intelligence.py tests/test_telegram_api.py tests/test_wallet.py tests/test_market_flow.py tests/test_market_intelligence.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
