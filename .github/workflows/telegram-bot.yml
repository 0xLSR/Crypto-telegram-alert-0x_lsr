name: Telegram Crypto Alerts

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-bot-polling
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      ALERT_THRESHOLD_PERCENT: ${{ vars.ALERT_THRESHOLD_PERCENT || '10' }}
      ALERT_COOLDOWN_MINUTES: ${{ vars.ALERT_COOLDOWN_MINUTES || '30' }}
      INTELLIGENCE_ENABLED: ${{ vars.INTELLIGENCE_ENABLED || 'true' }}
      INTELLIGENCE_INTERVAL_SECONDS: ${{ vars.INTELLIGENCE_INTERVAL_SECONDS || '60' }}
      HISTORY_RETENTION_HOURS: ${{ vars.HISTORY_RETENTION_HOURS || '24' }}
      MIN_INTELLIGENCE_SCORE: ${{ vars.MIN_INTELLIGENCE_SCORE || '75' }}
      SMART_ALERTS_ENABLED: ${{ vars.SMART_ALERTS_ENABLED || 'true' }}
      SMART_FLOW_COOLDOWN_MINUTES: ${{ vars.SMART_FLOW_COOLDOWN_MINUTES || '30' }}
      FLOW_REQUESTS_PER_CYCLE: ${{ vars.FLOW_REQUESTS_PER_CYCLE || '3' }}
      WHALE_FLOW_WEIGHT_PERCENT: ${{ vars.WHALE_FLOW_WEIGHT_PERCENT || '10' }}
      RUN_FOR_SECONDS: "21000"
      BOT_STATE_FILE: data/state.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore bot state cache
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: ${{ runner.os }}-telegram-bot-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-telegram-bot-state-

      - name: Validate configuration
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Configure the TELEGRAM_BOT_TOKEN repository secret."
            exit 1
          fi

      - name: Run bot polling window
        run: python bot.py
